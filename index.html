<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonics & 默書大挑戰！</title>
    <!-- 引入強大的 Standalone Standalone SheetJS 引擎，用於無痛導出 Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #4A90E2;    /* 經典教育藍 */
            --secondary-color: #5C6BC0;  /* 柔和靛藍 */
            --accent-color: #F5A623;     /* 溫暖橙黃（金幣） */
            --correct-color: #2ECC71;    /* 護眼綠 */
            --wrong-color: #E74C3C;      /* 警示紅 */
            --bg-color: #F4F6F9;         /* 簡約淺灰背景 */
            --card-bg: #FFFFFF;          /* 純白卡片 */
            --text-color: #2C3E50;       /* 深石板灰（文字讀取舒服） */
            --text-muted: #7F8C8D;       /* 輔助灰色 */
            --border-color: #E2E8F0;     /* 輕感邊框 */
        }
        body {
            font-family: 'PingFang HK', 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: var(--card-bg);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            position: relative;
            border: 1px solid var(--border-color);
        }
        .coin-counter {
            position: absolute;
            top: 25px;
            right: 25px;
            background: #FFFBEB;
            border: 2px solid var(--accent-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #D97706;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(245, 166, 35, 0.1);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .coin-counter.bump {
            transform: scale(1.25);
            background: #FEF3C7;
        }
        .coin-counter.deduct {
            transform: scale(0.9);
            background: #FEE2E2;
            border-color: var(--wrong-color);
            color: var(--wrong-color);
            animation: shake 0.4s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0) scale(0.9); }
            20%, 60% { transform: translateX(-6px) scale(0.9); }
            40%, 80% { transform: translateX(6px) scale(0.9); }
        }
        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 1.8rem;
            font-weight: bold;
        }
        .subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .grade-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #FFFFFF;
            color: var(--text-color);
            border: 2px solid var(--border-color);
            padding: 12px 15px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover {
            border-color: var(--primary-color);
            background-color: #F8FAFC;
            transform: translateY(-1px);
        }
        .btn-grade.active, .btn-mode.active, .btn-submode.active {
            color: white !important;
            border-color: transparent !important;
        }
        .btn-grade.active {
            background-color: var(--primary-color) !important;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }
        .btn-mode.active {
            background-color: var(--secondary-color) !important;
            box-shadow: 0 4px 12px rgba(92, 107, 192, 0.3);
        }
        .btn-submode {
            background-color: #F1F5F9;
            font-size: 0.9rem;
            padding: 10px 16px;
            border: 1px solid transparent;
        }
        .btn-submode.active {
            background-color: var(--primary-color) !important;
            color: white;
            border-color: var(--primary-color);
        }
        .mode-selector, .submode-selector {
            background: #F8FAFC;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            display: none;
            animation: fadeIn 0.3s;
        }
        .mode-options, .submode-options {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-leaderboard {
            background-color: #F5A623;
            color: white;
            margin-top: 15px;
            width: 100%;
            border: none;
        }
        .btn-leaderboard:hover {
            background-color: #E2951B;
        }
        .game-area {
            display: none;
            margin-top: 20px;
            width: 100%;
        }
        .progress-bar {
            background: #E2E8F0;
            border-radius: 10px;
            height: 10px;
            width: 100%;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            background: var(--primary-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .speed-control {
            background: #F8FAFC;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .speed-control label {
            font-weight: bold;
            color: var(--text-color);
            font-size: 1rem;
        }
        .speed-slider {
            width: 80%;
            cursor: pointer;
            accent-color: var(--primary-color);
        }
        .audio-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }
        .btn-audio {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }
        .btn-phonics {
            background-color: #2EC4B6;
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }
        .hints-container {
            margin-bottom: 20px;
            font-size: 1.1rem;
            min-height: 40px;
        }
        .phonics-hint {
            letter-spacing: 3px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .meaning-hint {
            font-size: 1.15rem;
            color: var(--primary-color);
            margin-top: 5px;
            font-weight: bold;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .spell-input {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            font-size: 1.25rem;
            border: 2px solid var(--border-color);
            background-color: #FFFFFF;
            color: var(--text-color);
            border-radius: 12px;
            text-align: center;
            outline: none;
            transition: border 0.2s;
            resize: vertical;
        }
        .spell-input:focus {
            border-color: var(--primary-color);
        }
        .btn-submit {
            background-color: var(--text-color);
            color: #FFFFFF;
            padding: 14px;
            font-size: 1.2rem;
            border-radius: 12px;
            width: 100%;
            font-weight: bold;
            border: none;
        }
        .feedback {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 40px;
            line-height: 1.4;
        }
        .feedback.correct { color: var(--correct-color); }
        .feedback.wrong { color: var(--wrong-color); }
        .score-display {
            font-size: 3.5rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 20px 0;
        }
        .select-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 12px;
        }
        .custom-select {
            padding: 10px 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            background-color: #FFFFFF;
            color: var(--text-color);
            font-weight: bold;
            outline: none;
        }
        /* 龍虎榜表格排版 */
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.95rem;
            background-color: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }
        .leaderboard-table th, .leaderboard-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-color);
        }
        .leaderboard-table th {
            background-color: #F8FAFC;
            color: var(--secondary-color);
            font-weight: bold;
        }
        .rank-top1 { color: #F1C40F; font-weight: bold; font-size: 1.2rem; }
        .rank-top2 { color: #95A5A6; font-weight: bold; font-size: 1.1rem; }
        .rank-top3 { color: #D35400; font-weight: bold; font-size: 1.1rem; }
        
        /* 刪除按鈕 */
        .btn-delete {
            background: none;
            border: none;
            color: var(--wrong-color);
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .btn-delete:hover {
            color: #C0392B;
        }

        .admin-panel {
            background: #F1F5F9;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            display: none;
        }

        .reward-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            user-select: none;
            animation: burstParticle 1.2s ease-out forwards;
        }
        @keyframes burstParticle {
            0% { opacity: 1; transform: translate(0, 0) scale(0.6) rotate(0deg); }
            70% { opacity: 1; transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(var(--rot)); }
            100% { opacity: 0; transform: translate(var(--tx), calc(var(--ty) - 50px)) scale(1.1) rotate(calc(var(--rot) + 45deg)); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="coin-counter" id="coin-box">
        <span>🪙</span>
        <span id="coin-count">0</span>
    </div>
    <h1>✨ 英語拼音與默書大挑戰</h1>
    <p class="subtitle">請選擇年級，再選擇您要溫習的默書或詞彙！</p>

    <!-- 步驟 1：選擇年級與主畫面 -->
    <div id="setup-screen">
        <h3 style="margin-bottom: 15px; color: var(--primary-color);">👉 1. 請選擇你的年級：</h3>
        <div class="grade-selector">
            <button class="btn btn-grade" onclick="selectGrade('P1')">P1</button>
            <button class="btn btn-grade" onclick="selectGrade('P2')">P2</button>
            <button class="btn btn-grade" onclick="selectGrade('P3')">P3</button>
            <button class="btn btn-grade" onclick="selectGrade('P4')">P4</button>
            <button class="btn btn-grade" onclick="selectGrade('P5')">P5</button>
            <button class="btn btn-grade" onclick="selectGrade('P6')">P6</button>
        </div>

        <div id="mode-selection-area" class="mode-selector">
            <h3 style="margin-bottom: 15px; color: var(--primary-color);">👉 2. 請選擇溫習大類：</h3>
            <div class="mode-options">
                <button class="btn btn-mode" id="mode-dict-word" onclick="chooseCategory('dictation_word')">📝 默書單字</button>
                <button class="btn btn-mode" id="mode-dict-sent" onclick="chooseCategory('dictation_sentence')">✍️ 句子默寫</button>
                <button class="btn btn-mode" id="mode-extra" onclick="chooseCategory('extra_vocab')">🧠 補充詞彙</button>
            </div>
        </div>

        <div id="submode-selection-area" class="submode-selector">
            <h3 id="submode-title" style="margin-bottom: 15px; color: var(--primary-color);">👉 3. 請選擇具體範圍：</h3>
            <div id="submode-options-container" class="submode-options"></div>
        </div>

        <button id="btn-start" class="btn" style="width: 100%; background-color: var(--correct-color); color: white; display: none; margin-top: 15px;" onclick="startGame()">開始溫習遊戲 🚀</button>
        <button class="btn btn-leaderboard" onclick="openLeaderboard()">🏆 查看榮譽龍虎榜</button>
    </div>

    <!-- 步驟 2：遊戲進行畫面 -->
    <div id="game-screen" class="game-area">
        <div class="progress-bar">
            <div id="progress" class="progress-fill"></div>
        </div>
        <p style="font-size: 1rem; color: var(--text-color); font-weight: bold;">
            第 <span id="current-question">1</span> 題 / 共 <span id="total-questions">5</span> 題 
            (<span id="current-mode-label"></span>)
        </p>
        <div class="speed-control">
            <label for="speed-slider">🗣️ 朗讀速度: <span id="speed-label">適中</span></label>
            <input type="range" id="speed-slider" class="speed-slider" min="0.3" max="1.0" step="0.1" value="0.7" oninput="updateSpeedLabel()">
        </div>
        <div class="audio-buttons">
            <button class="btn btn-audio" onclick="playWordSound()">🔊 聽發音</button>
            <button id="btn-phonics-hint" class="btn btn-phonics" onclick="showPhonicsHint()">🧩 Phonics 提示</button>
        </div>
        <div class="hints-container">
            <div id="phonics-display" class="phonics-hint"></div>
            <div id="meaning-display" class="meaning-hint"></div>
        </div>
        <div class="input-group">
            <textarea id="user-input" class="spell-input" rows="2" placeholder="在這裡輸入答案..." autocomplete="off" onkeyup="handleKeyUp(event)"></textarea>
            <button class="btn btn-submit" onclick="checkAnswer()">提交</button>
        </div>
        <div id="feedback-msg" class="feedback"></div>
    </div>

    <!-- 步驟 3：結算畫面與本機龍虎榜 -->
    <div id="result-screen" style="display:none;">
        <h2>🎉 挑戰完成！</h2>
        <div class="score-display"><span id="final-score">0</span> / 100 分</div>
        <p style="font-size: 1.3rem; color: var(--accent-color); font-weight: bold;">獲得金幣：<span id="total-earned-coins">0</span> 🪙</p>
        
        <div id="save-score-area" style="background:#F8FAFC; padding:20px; border-radius:18px; margin:20px 0; border: 1px solid var(--border-color);">
            <p style="font-weight:bold; margin-top:0; color:var(--primary-color); font-size:1.1rem;">🎖️ 將成績登錄到榮譽龍虎榜：</p>
            <div class="select-row">
                <select id="player-class" class="custom-select" style="flex:1;">
                    <option value="">選擇班別</option>
                    <optgroup label="一年級">
                        <option value="1A">1A</option><option value="1B">1B</option><option value="1C">1C</option><option value="1D">1D</option><option value="1E">1E</option>
                    </optgroup>
                    <optgroup label="二年級">
                        <option value="2A">2A</option><option value="2B">2B</option><option value="2C">2C</option><option value="2D">2D</option><option value="2E">2E</option>
                    </optgroup>
                    <optgroup label="三年級">
                        <option value="3A">3A</option><option value="3B">3B</option><option value="3C">3C</option><option value="3D">3D</option><option value="3E">3E</option>
                    </optgroup>
                    <optgroup label="四年級">
                        <option value="4A">4A</option><option value="4B">4B</option><option value="4C">4C</option><option value="4D">4D</option><option value="4E">4E</option>
                    </optgroup>
                    <optgroup label="五年級">
                        <option value="5A">5A</option><option value="5B">5B</option><option value="5C">5C</option><option value="5D">5D</option><option value="5E">5E</option>
                    </optgroup>
                    <optgroup label="六年級">
                        <option value="6A">6A</option><option value="6B">6B</option><option value="6C">6C</option><option value="6D">6D</option><option value="6E">6E</option>
                    </optgroup>
                </select>
                <select id="player-number" class="custom-select" style="flex:1;">
                    <option value="">選擇學號</option>
                </select>
            </div>
            <div style="margin-bottom: 12px;">
                <input type="text" id="player-name" placeholder="英文名 English Name (選填 Optional)" style="width:92%; padding:10px; font-size:1rem; border-radius:8px; border:2px solid var(--border-color); text-align:center;">
            </div>
            <button id="btn-save-score" class="btn" style="background-color: var(--correct-color); color:white; width:100%; border:none;" onclick="saveToLeaderboard()">確認登錄龍虎榜 🏅</button>
        </div>
        <p id="evaluation-msg" style="margin-bottom: 25px; font-weight: bold;"></p>
        <button class="btn btn-leaderboard" onclick="openLeaderboard()">🏆 查看龍虎榜</button>
        <button class="btn" style="background-color: var(--primary-color); color: white; width: 100%; margin-top:10px;" onclick="resetGame()">返回主頁 🔄</button>
    </div>

    <!-- 步驟 4：獨立龍虎榜畫面 -->
    <div id="leaderboard-screen" style="display:none;">
        <h2 id="leaderboard-title" style="cursor:pointer; user-select:none; color: var(--primary-color);" ondblclick="adminClearPrompt()">🏆 榮譽龍虎榜 (Top 10)</h2>
        
        <!-- 管理員面板：點擊標題並輸入密碼開關 -->
        <div id="admin-panel" class="admin-panel">
            <h4 style="margin-top:0; color: var(--wrong-color);">🛠️ 管理員控制面板 (後端)</h4>
            <button class="btn" style="background-color: var(--correct-color); color: white; border: none; margin-right: 10px;" onclick="exportToExcel()">📊 匯出完整成績 Excel</button>
            <button class="btn" style="background-color: var(--wrong-color); color: white; border: none;" onclick="clearAllData()">🗑️ 清空所有成績</button>
        </div>

        <div style="max-height: 340px; overflow-y: auto;">
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>排名</th>
                        <th>班別學號 / 姓名</th>
                        <th>年級模式</th>
                        <th>得分</th>
                        <th>金幣</th>
                        <th class="admin-col" style="display: none;">管理</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>
        <button class="btn" style="background-color: #95A5A6; color:white; width:100%; margin-top:15px;" onclick="closeLeaderboard()">返回 🔙</button>
    </div>
</div>

<script>
    // 🗄️ 英語默書與補充詞彙完整資料庫
    const wordDatabase = {db_json_str};

    let selectedGrade = '';
    let selectedCategory = '';
    let selectedSubmode = '';
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let earnedCoins = 0;
    let isAdminLoggedIn = false;

    // 初始化學號下拉選單 (01 至 35 號)
    function initClassNumbers() {
        const select = document.getElementById('player-number');
        select.innerHTML = '<option value="">選擇學號</option>';
        for (let i = 1; i <= 35; i++) {
            const val = i < 10 ? '0' + i : '' + i;
            const opt = document.createElement('option');
            opt.value = val;
            opt.textContent = val + ' 號';
            select.appendChild(opt);
        }
    }
    initClassNumbers();

    function selectGrade(grade) {
        selectedGrade = grade;
        selectedCategory = '';
        selectedSubmode = '';
        document.getElementById('btn-start').style.display = 'none';
        document.getElementById('submode-selection-area').style.display = 'none';

        document.querySelectorAll('.btn-grade').forEach(btn => {
            btn.classList.remove('active');
            if (btn.textContent === grade) btn.classList.add('active');
        });

        document.getElementById('mode-selection-area').style.display = 'block';
        document.querySelectorAll('.btn-mode').forEach(btn => btn.classList.remove('active'));
    }

    function chooseCategory(category) {
        selectedCategory = category;
        selectedSubmode = '';
        document.getElementById('btn-start').style.display = 'none';

        document.querySelectorAll('.btn-mode').forEach(btn => {
            btn.classList.remove('active');
        });
        if (category === 'dictation_word') document.getElementById('mode-dict-word').classList.add('active');
        if (category === 'dictation_sentence') document.getElementById('mode-dict-sent').classList.add('active');
        if (category === 'extra_vocab') document.getElementById('mode-extra').classList.add('active');

        const gradeData = wordDatabase[selectedGrade] || {};
        const catData = gradeData[category] || {};
        const container = document.getElementById('submode-options-container');
        container.innerHTML = '';

        const keys = Object.keys(catData);
        if (keys.length > 0) {
            document.getElementById('submode-selection-area').style.display = 'block';
            keys.forEach(key => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-submode';
                btn.textContent = key;
                btn.onclick = () => selectSubmode(key);
                container.appendChild(btn);
            });
            selectSubmode(keys[0]);
        } else {
            document.getElementById('submode-selection-area').style.display = 'none';
            alert('抱歉，此年級目前沒有這個溫習大類。');
        }
    }

    function selectSubmode(submode) {
        selectedSubmode = submode;
        document.querySelectorAll('.btn-submode').forEach(btn => {
            btn.classList.remove('active');
            if (btn.textContent === submode) btn.classList.add('active');
        });
        document.getElementById('btn-start').style.display = 'block';
    }

    function startGame() {
        const pool = wordDatabase[selectedGrade][selectedCategory][selectedSubmode] || [];
        currentQuestions = [...pool].sort(() => 0.5 - Math.random());

        if (currentQuestions.length === 0) {
            alert('這個模式目前沒有題目，請選擇其他模式。');
            return;
        }

        currentIndex = 0;
        score = 0;
        earnedCoins = 0;
        document.getElementById('coin-count').textContent = '0';
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('leaderboard-screen').style.display = 'none';
        
        const modeLabels = { dictation_word: '單字聽寫', dictation_sentence: '句子/段落默寫', extra_vocab: '補充詞彙' };
        document.getElementById('current-mode-label').textContent = `${selectedGrade} - ${modeLabels[selectedCategory]} (${selectedSubmode})`;
        
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex >= currentQuestions.length) {
            showResults();
            return;
        }

        const hasPhonics = !!currentQuestions[currentIndex].phonicsArr;
        document.getElementById('feedback-msg').innerHTML = '';
        document.getElementById('user-input').value = '';
        document.getElementById('user-input').focus();
        document.getElementById('btn-phonics-hint').style.display = hasPhonics ? 'inline-block' : 'none';

        const progressPercent = (currentIndex / currentQuestions.length) * 100;
        document.getElementById('progress').style.width = progressPercent + '%';
        document.getElementById('current-question').textContent = currentIndex + 1;
        document.getElementById('total-questions').textContent = currentQuestions.length;
        document.getElementById('phonics-display').textContent = hasPhonics ? '❓ 按按鈕獲取拼音提示' : '';

        const currentMeaning = currentQuestions[currentIndex].meaning;
        document.getElementById('meaning-display').textContent = currentMeaning ? `💡 中文意思：${currentMeaning}` : '';

        setTimeout(() => playWordSound(), 500);
    }

    function playWordSound() {
        if (!('speechSynthesis' in window) || !currentQuestions[currentIndex]) {
            if (!('speechSynthesis' in window)) alert('瀏覽器不支援語音功能！');
            return;
        }

        window.speechSynthesis.cancel();
        const text = currentQuestions[currentIndex].word;
        const currentSpeed = parseFloat(document.getElementById('speed-slider').value);
        const isLongText = text.includes(' ') || selectedCategory === 'dictation_sentence';

        if (isLongText) {
            const words = text.split(' ');
            let delay = 0;
            words.forEach((w) => {
                setTimeout(() => {
                    const wordUtterance = new SpeechSynthesisUtterance(w);
                    wordUtterance.lang = 'en-US';
                    wordUtterance.rate = currentSpeed;
                    window.speechSynthesis.speak(wordUtterance);
                }, delay);
                const dynamicPause = 400 + ((1.0 - currentSpeed) * 800);
                delay += (w.length * 60) * (1 / currentSpeed) + dynamicPause;
            });
        } else {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = currentSpeed;
            window.speechSynthesis.speak(utterance);
        }
    }

    function showPhonicsHint() {
        const currentData = currentQuestions[currentIndex];
        if (!currentData || !currentData.phonicsArr) return;

        const hintPlaceholders = currentData.phonicsArr.map(part => {
            if (part === ' ') return ' ';
            return '_'.repeat(part.length);
        }).join(' - ');

        document.getElementById('phonics-display').textContent = `拼音格式：${hintPlaceholders}`;

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            currentData.phonicsArr.forEach((part, index) => {
                setTimeout(() => {
                    const partUtterance = new SpeechSynthesisUtterance(part);
                    partUtterance.lang = 'en-US';
                    partUtterance.rate = 0.5;
                    window.speechSynthesis.speak(partUtterance);
                }, index * 800);
            });
        }
    }

    function checkAnswer() {
        const userInput = document.getElementById('user-input').value.trim();
        if (userInput === '') return;

        const correctAnswer = currentQuestions[currentIndex].word.trim();
        const feedback = document.getElementById('feedback-msg');

        const cleanStr = (str) => str.toLowerCase().replace(/\s+/g, ' ').replace(/[.,/#!$%^&*;:{}=\-_`~()?']/g,"").trim();
        const cleanUser = cleanStr(userInput);
        const cleanCorrect = cleanStr(correctAnswer);

        if (cleanUser === cleanCorrect) {
            if (userInput !== correctAnswer) {
                feedback.innerHTML = `🎉 答對了！但要注意大小寫或標點符號喔！<br><span style="color:#A0A0B0; font-size:0.95rem;">標準答案：<b>${correctAnswer}</b></span>`;
            } else {
                feedback.textContent = '🎉 完美正確！太棒了！';
            }
            feedback.className = 'feedback correct';
            score += (100 / currentQuestions.length);
            playFeedbackSound(true);
            spawnRewardBurst();
        } else {
            feedback.innerHTML = `❌ 答錯囉！正確答案是：<br><span style="font-size:1.15rem; color:var(--wrong-color);"><b>${correctAnswer}</b></span>`;
            feedback.className = 'feedback wrong';
            playFeedbackSound(false);
            deductCoinsOnWrong();
        }

        document.getElementById('user-input').disabled = true;
        setTimeout(() => {
            document.getElementById('user-input').disabled = false;
            currentIndex++;
            loadQuestion();
        }, 4000);
    }

    function handleKeyUp(event) {
        if (event.key === 'Enter' && !currentQuestions[currentIndex]?.word.includes(' ')) {
            checkAnswer();
        }
    }

    function playFeedbackSound(isCorrect) {
        if (!window.AudioContext && !window.webkitAudioContext) return;
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (isCorrect) {
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.3);
        } else {
            osc.frequency.setValueAtTime(150, ctx.currentTime);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.4);
        }
    }

    function spawnRewardBurst() {
        const icons = ['🪙', '⭐', '✨', '🌟', '🪙', '⭐'];
        const numParticles = 24;
        const rect = document.getElementById('user-input').getBoundingClientRect();
        const startX = rect.left + rect.width / 2;
        const startY = rect.top + rect.height / 2;

        for (let i = 0; i < numParticles; i++) {
            const el = document.createElement('div');
            el.className = 'reward-particle';
            el.textContent = icons[Math.floor(Math.random() * icons.length)];
            el.style.fontSize = (Math.random() * 16 + 22) + 'px';
            el.style.left = startX + 'px';
            el.style.top = startY + 'px';

            const angle = (Math.PI * 2 * i) / numParticles + (Math.random() - 0.5) * 0.5;
            const distance = Math.random() * 140 + 80;
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance - 40;
            const rot = (Math.random() * 360 - 180) + 'deg';

            el.style.setProperty('--tx', `${tx}px`);
            el.style.setProperty('--ty', `${ty}px`);
            el.style.setProperty('--rot', rot);

            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1200);
        }

        earnedCoins += 10;
        const coinBox = document.getElementById('coin-box');
        const coinCount = document.getElementById('coin-count');
        coinCount.textContent = earnedCoins;
        coinBox.classList.add('bump');
        setTimeout(() => coinBox.classList.remove('bump'), 250);
    }

    function deductCoinsOnWrong() {
        const penalty = 5;
        if (earnedCoins > 0) {
            earnedCoins = Math.max(0, earnedCoins - penalty);
            document.getElementById('coin-count').textContent = earnedCoins;
        }
        const coinBox = document.getElementById('coin-box');
        coinBox.classList.add('deduct');
        setTimeout(() => coinBox.classList.remove('deduct'), 400);
    }

    function updateSpeedLabel() {
        const val = parseFloat(document.getElementById('speed-slider').value);
        const label = document.getElementById('speed-label');
        if (val >= 0.9) { label.textContent = '正常'; }
        else if (val >= 0.7) { label.textContent = '適中'; }
        else if (val >= 0.5) { label.textContent = '慢速'; }
        else { label.textContent = '極慢'; }
    }

    function showResults() {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        const finalScoreRounded = Math.round(score);
        document.getElementById('final-score').textContent = finalScoreRounded;
        document.getElementById('total-earned-coins').textContent = earnedCoins;

        if (selectedGrade) {
            const gradeNum = selectedGrade.replace('P', '');
            document.getElementById('player-class').value = `${gradeNum}A`;
        }

        let evalMsg = '';
        if (finalScoreRounded === 100) {
            evalMsg = '🏆 完美的表現！您已經徹底掌握了這次的溫習範圍！';
        } else if (finalScoreRounded >= 80) {
            evalMsg = '🌟 表現非常優異！快去挑戰滿分吧！';
        } else if (finalScoreRounded >= 60) {
            evalMsg = '👍 順利合格！錯的地方可以多聽寫幾遍。';
        } else {
            evalMsg = '💪 不要氣餒！再練習幾次，你的聽力和拼寫會進步神速！';
        }
        document.getElementById('evaluation-msg').textContent = evalMsg;
    }

    // 🏆 龍虎榜本機儲存與管理功能
    function saveToLeaderboard() {
        const userClass = document.getElementById('player-class').value;
        const userNumber = document.getElementById('player-number').value;
        const englishName = document.getElementById('player-name').value.trim();

        if (!userClass) { alert('請先選擇您的班別！'); return; }
        if (!userNumber) { alert('請先選擇您的學號！'); return; }

        let displayName = `${userClass} (${userNumber})`;
        if (englishName) { displayName += ` ${englishName}`; }

        const modeLabels = { dictation_word: '單字', dictation_sentence: '句子', extra_vocab: '補充' };
        const record = {
            id: Date.now(), // 唯一標識，便於刪除
            name: displayName,
            gradeMode: `${selectedGrade} ${modeLabels[selectedCategory]} (${selectedSubmode})`,
            score: Math.round(score),
            coins: earnedCoins,
            date: new Date().toLocaleString()
        };

        let list = JSON.parse(localStorage.getItem('dictation_leaderboard_v2') || '[]');
        list.push(record);
        // 按分數高到低，金幣多到低排序
        list.sort((a, b) => b.score - a.score || b.coins - a.coins);
        localStorage.setItem('dictation_leaderboard_v2', JSON.stringify(list));

        alert('🎉 成績已成功登錄到榮譽龍虎榜！');
        document.getElementById('save-score-area').style.display = 'none';
        openLeaderboard();
    }

    // 🏆 顯示龍虎榜
    function openLeaderboard() {
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('leaderboard-screen').style.display = 'block';

        const list = JSON.parse(localStorage.getItem('dictation_leaderboard_v2') || '[]');
        const tbody = document.getElementById('leaderboard-body');
        tbody.innerHTML = '';

        if (list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="color:#95A5A6; padding:20px;">目前尚無紀錄，快來挑戰成為第一名！</td></tr>';
            return;
        }

        // 頁面龍虎榜只顯示 Top 10
        const displayList = list.slice(0, 10);

        displayList.forEach((item, idx) => {
            let rankClass = '';
            let medal = idx + 1;
            if (idx === 0) { medal = '🥇 1'; rankClass = 'rank-top1'; }
            else if (idx === 1) { medal = '🥈 2'; rankClass = 'rank-top2'; }
            else if (idx === 2) { medal = '🥉 3'; rankClass = 'rank-top3'; }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="${rankClass}">${medal}</td>
                <td style="font-weight:bold; color:var(--text-color);">${escapeHtml(item.name)}</td>
                <td>${item.gradeMode}</td>
                <td style="color:var(--primary-color); font-weight:bold;">${item.score}</td>
                <td style="color:var(--accent-color); font-weight:bold;">${item.coins} 🪙</td>
                <td class="admin-col" style="display: ${isAdminLoggedIn ? 'table-cell' : 'none'};">
                    <button class="btn-delete" onclick="deleteRecord(${item.id})">❌</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        // 確保管理員模式下表格欄位同步
        const adminCols = document.querySelectorAll('.admin-col');
        adminCols.forEach(col => col.style.display = isAdminLoggedIn ? 'table-cell' : 'none');
    }

    // 🔐 管理員安全連入：雙擊標題觸開
    function adminClearPrompt() {
        if (isAdminLoggedIn) {
            // 已登入，則雙擊可以登出
            if (confirm('確定要關閉管理員模式嗎？')) {
                isAdminLoggedIn = false;
                document.getElementById('admin-panel').style.display = 'none';
                openLeaderboard();
            }
            return;
        }

        const password = prompt('🔐 管理員安全驗證：\n請輸入管理員密碼解鎖管理功能：');
        if (password === null) return;

        if (password === 'bcklas') {
            isAdminLoggedIn = true;
            alert('🔓 驗證成功！管理員工具已開啟：可刪除特定成績、匯出完整 Excel 報表。');
            document.getElementById('admin-panel').style.display = 'block';
            openLeaderboard();
        } else {
            alert('❌ 密碼錯誤！您無權限。');
        }
    }

    // 🗑️ 刪除單條記錄
    function deleteRecord(id) {
        if (confirm('確定要刪除這筆學生成績記錄嗎？（此操作不可復原）')) {
            let list = JSON.parse(localStorage.getItem('dictation_leaderboard_v2') || '[]');
            list = list.filter(item => item.id !== id);
            localStorage.setItem('dictation_leaderboard_v2', JSON.stringify(list));
            openLeaderboard();
        }
    }

    // 🗑️ 清空所有記錄
    function clearAllData() {
        if (confirm('⚠️ 警告：確定要清空龍虎榜上的「所有」學生成績記錄嗎？（此操作不可復原）')) {
            localStorage.removeItem('dictation_leaderboard_v2');
            alert('🗑️ 所有成績已被清空。');
            openLeaderboard();
        }
    }

    // 📊 匯出完整 Excel (SheetJS 無損匯出)
    function exportToExcel() {
        const list = JSON.parse(localStorage.getItem('dictation_leaderboard_v2') || '[]');
        if (list.length === 0) {
            alert('目前沒有學生成績數據可以匯出。');
            return;
        }

        // 準備 Excel 資料格式
        const excelData = list.map((item, idx) => ({
            '排名 (Rank)': idx + 1,
            '班別學號姓名 (Student Info)': item.name,
            '年級範圍 (Grade & Scope)': item.gradeMode,
            '得分 (Score)': item.score,
            '金幣 (Coins)': item.coins,
            '登錄時間 (Date)': item.date
        }));

        // 建立 Sheet 和 Workbook
        const worksheet = XLSX.utils.json_to_sheet(excelData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "學生成績");

        // 自動調整寬度
        const maxLen = excelData.reduce((acc, row) => {
            Object.keys(row).forEach((key, i) => {
                const valStr = String(row[key]);
                acc[i] = Math.max(acc[i] || 10, valStr.length * 1.5);
            });
            return acc;
        }, []);
        worksheet["!cols"] = maxLen.map(w => ({ wch: w }));

        // 下載檔案
        XLSX.writeFile(workbook, `英語默書挑戰成績單_${new Date().toLocaleDateString()}.xlsx`);
    }

    function closeLeaderboard() {
        document.getElementById('leaderboard-screen').style.display = 'none';
        document.getElementById('setup-screen').style.display = 'block';
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function resetGame() {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('setup-screen').style.display = 'block';

        document.querySelectorAll('.btn-grade').forEach(btn => btn.classList.remove('active'));
        document.getElementById('mode-selection-area').style.display = 'none';
        document.getElementById('submode-selection-area').style.display = 'none';
        document.getElementById('btn-start').style.display = 'none';

        document.getElementById('save-score-area').style.display = 'block';
        document.getElementById('player-class').value = '';
        document.getElementById('player-number').value = '';
        document.getElementById('player-name').value = '';
    }
</script>
