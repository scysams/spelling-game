<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蘇老師的 Phonics & 默書大挑戰！</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --secondary-color: #50E3C2;
            --correct-color: #2ECC71;
            --wrong-color: #E74C3C;
            --extra-vocab-color: #9B59B6;
            --dark-color: #2C3E50;
            --bg-color: #F5F7FA;
            --gold-color: #F1C40F;
        }

        body {
            font-family: 'PingFang HK', 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--dark-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
        }

        /* 右上角金幣計數器 */
        .coin-counter {
            position: absolute;
            top: 20px;
            right: 25px;
            background: #FFF9E6;
            border: 2px solid var(--gold-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #D68910;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(241, 196, 15, 0.2);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .coin-counter.bump {
            transform: scale(1.25);
            background: #FEF5D1;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        .subtitle {
            color: #7F8C8D;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .grade-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }
        
        .mode-selector {
            display: none;
            background: #F0F4F8;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            animation: fadeIn 0.3s;
        }

        .mode-options {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            background-color: #ECF0F1;
            border: none;
            padding: 12px 15px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-grade.active, .btn-mode.active {
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .btn-grade.active { background-color: var(--primary-color); }
        .btn-mode.active[data-mode="dictation"] { background-color: var(--primary-color); }
        .btn-mode.active[data-mode="sentence"] { background-color: #27AE60; }
        .btn-mode.active[data-mode="extra_vocab"] { background-color: var(--extra-vocab-color); }

        .game-area {
            display: none;
            margin-top: 20px;
            width: 100%;
        }

        .progress-bar {
            background: #E0E0E0;
            border-radius: 10px;
            height: 10px;
            width: 100%;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            background: var(--secondary-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .speed-control {
            background: #F8F9F9;
            border: 2px solid #E5E8E8;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .speed-control label {
            font-weight: bold;
            color: var(--dark-color);
            font-size: 1.05rem;
        }
        
        #speed-label { color: var(--extra-vocab-color); }

        .speed-slider {
            width: 80%;
            cursor: pointer;
            accent-color: var(--extra-vocab-color);
        }

        .audio-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn-audio {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.2);
            transition: all 0.2s ease;
        }
        
        .btn-phonics {
            background-color: var(--secondary-color);
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(80, 227, 194, 0.2);
            transition: all 0.2s ease;
        }

        .btn-audio:hover, .btn-phonics:hover {
            transform: translateY(-2px);
            filter: brightness(0.95);
        }

        .hints-container {
            margin-bottom: 20px;
            font-size: 1.1rem;
            min-height: 40px;
        }

        .phonics-hint {
            letter-spacing: 3px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #7F8C8D;
            line-height: 1.5;
        }

        .meaning-hint {
            font-size: 1.05rem;
            color: #2980B9;
            margin-top: 5px;
            font-weight: bold;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .spell-input {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            font-size: 1.2rem;
            border: 2px solid #BDC3C7;
            border-radius: 12px;
            text-align: center;
            outline: none;
            transition: border 0.2s;
            font-family: inherit;
            resize: vertical;
        }

        .spell-input:focus {
            border-color: var(--primary-color);
        }

        .btn-submit {
            background-color: var(--dark-color);
            color: white;
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 12px;
            width: 100%;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-submit:hover { background-color: #34495E; }

        .feedback {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 40px;
            line-height: 1.4;
        }

        .feedback.correct { color: var(--correct-color); }
        .feedback.wrong { color: var(--wrong-color); }

        .result-screen { display: none; }

        .score-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 20px 0;
        }

        /* 獎勵粒子動態樣式 */
        .reward-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            user-select: none;
            animation: burstParticle 1.2s ease-out forwards;
        }

        @keyframes burstParticle {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.6) rotate(0deg);
            }
            70% {
                opacity: 1;
                transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(var(--rot));
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), calc(var(--ty) - 50px)) scale(1.1) rotate(calc(var(--rot) + 45deg));
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<div class="container">
    <div class="coin-counter" id="coin-box">
        <span>🪙</span>
        <span id="coin-count">0</span>
    </div>

    <h1>✨ 英語串字與默書大挑戰</h1>
    <p class="subtitle">請選擇年級，再挑選想溫習的模式！</p>

    <!-- 步驟 1：選擇年級 -->
    <div id="setup-screen">
        <h3 style="margin-bottom: 15px;">👉 1. 請選擇你的年級：</h3>
        <div class="grade-selector">
            <button class="btn btn-grade" onclick="selectGrade('P1')">P1</button>
            <button class="btn btn-grade" onclick="selectGrade('P2')">P2</button>
            <button class="btn btn-grade" onclick="selectGrade('P3')">P3</button>
            <button class="btn btn-grade" onclick="selectGrade('P4')">P4</button>
            <button class="btn btn-grade" onclick="selectGrade('P5')">P5</button>
            <button class="btn btn-grade" onclick="selectGrade('P6')">P6</button>
        </div>

        <div id="mode-selection-area" class="mode-selector">
            <h3 style="margin-bottom: 15px;">👉 2. 請選擇溫習模式：</h3>
            <div class="mode-options"></div>
        </div>

        <button id="btn-start" class="btn" style="width: 100%; background-color: var(--correct-color); color: white; display: none; margin-top: 15px;" onclick="startGame()">開始溫習遊戲 🚀</button>
    </div>

    <!-- 步驟 2：遊戲區域 -->
    <div id="game-screen" class="game-area">
        <div class="progress-bar">
            <div id="progress" class="progress-fill"></div>
        </div>
        <p style="font-size: 0.9rem; color: #7F8C8D;">第 <span id="current-question">1</span> 題 / 共 <span id="total-questions">5</span> 題 (<span id="current-mode-label"></span>)</p>

        <div class="speed-control">
            <label for="speed-slider">🗣️ 朗讀速度: <span id="speed-label">適中</span></label>
            <input type="range" id="speed-slider" class="speed-slider" min="0.3" max="1.0" step="0.1" value="0.7" oninput="updateSpeedLabel()">
        </div>

        <div class="audio-buttons">
            <button class="btn btn-audio" onclick="playWordSound()">🔊 聽發音</button>
            <button id="btn-phonics-hint" class="btn btn-phonics" onclick="showPhonicsHint()">🧩 Phonics 提示</button>
        </div>

        <div class="hints-container">
            <div id="phonics-display" class="phonics-hint"></div>
            <div id="meaning-display" class="meaning-hint"></div>
        </div>

        <div class="input-group">
            <textarea id="user-input" class="spell-input" rows="2" placeholder="在這裡輸入答案..." autocomplete="off" onkeyup="handleKeyUp(event)"></textarea>
            <button class="btn btn-submit" onclick="checkAnswer()">提交</button>
        </div>

        <div id="feedback-msg" class="feedback"></div>
    </div>

    <!-- 步驟 3：結算畫面 -->
    <div id="result-screen" class="result-screen">
        <h2>🎉 挑戰完成！</h2>
        <div class="score-display"><span id="final-score">0</span> / 100 分</div>
        <p style="font-size: 1.3rem; color: #D68910; font-weight: bold; margin-bottom: 15px;">本次共獲得 <span id="total-earned-coins">0</span> 枚金幣！🪙</p>
        <p id="evaluation-msg" style="margin-bottom: 25px; font-weight: bold;"></p>
        <button class="btn" style="background-color: var(--primary-color); color: white; width: 100%;" onclick="resetGame()">返回主頁 🔄</button>
    </div>
</div>

                { word: 'lemonade sale' }, { word: 'fancy dress day' }, { word: 'volunteer' }, { word: 'shelter' }, { word: 'medicine' }, { word: 'bazaar' }, { word: 'physically handicapped' },
                { word: 'phone-a-thon' }, { word: 'an author' }, { word: 'an illustrator' }, { word: 'the setting' }, { word: 'a plot' }, { word: 'characters' }, { word: 'a climax' },
                { word: 'the ending' }, { word: 'a book spine' }, { word: 'a play' }, { word: 'a comic' }, { word: 'fiction' }, { word: 'non-fiction' }, { word: 'sort out' }, { word: 'pick up' },
                { word: 'dress up' }, { word: 'grow up' }, { word: 'throw away' }, { word: 'gobble up' }, { word: 'tear up' }, { word: 'put on' }, { word: 'take off' }, { word: 'mess up' },
                { word: 'lie down' }, { word: 'split up' }, { word: 'origami' }, { word: 'feast' }, { word: 'praying' }, { word: 'celebrations' }, { word: 'face painting' }, { word: 'costume' },
                { word: 'Easter' }, { word: 'Christmas' }, { word: 'Halloween' }, { word: 'dumplings' }, { word: 'wish making' }, { word: 'carnival' }, { word: 'Yellow River' },
                { word: 'pagodas' }, { word: 'pavilions' }, { word: 'cheongsam' }, { word: 'kimono' }, { word: 'calligraphy' }, { word: 'cherry blossoms' }, { word: 'mummies' },
                { word: 'Grand Canyon' }, { word: 'Great Barrier Reef' }, { word: 'Sydney Opera House' }, { word: 'Yellowstone National Park' }, { word: 'food waste' },
                { word: 'eco-friendly' }, { word: 'conservation' }, { word: 'purchase' }, { word: 'excessive' }, { word: 'landfill' }, { word: 'electrical appliances' },
                { word: 'renewable energy' }, { word: 'greenhouse gases' }, { word: 'pollution' }, { word: 'deforestation' }, { word: 'toxic' }, { word: 'red wolf' },
                { word: 'Asian elephant' }, { word: 'tiger' }, { word: 'orangutan' }, { word: 'green turtle' }, { word: 'pangolins' }, { word: 'black rhino' }, { word: 'blue whale' },
                { word: 'amur leopard' }, { word: 'mountain gorilla' }, { word: 'African wild dog' }, { word: 'orinoco crocodile' }, { word: 'graduation' }, { word: 'alumnus/alumni' },
                { word: 'courage' }, { word: 'gratitude' }, { word: 'challenging' }, { word: 'positive mindset' }, { word: 'friendship' }, { word: 'furious about' },
                { word: 'anxious about' }, { word: 'delighted with' }, { word: 'crowded with' }, { word: 'jealous of' }, { word: 'commitment' }, { word: 'perseverance' },
                { word: 'unity' }, { word: 'respect' }, { word: 'empathy' }, { word: 'law-abidingness' }, { word: 'integrity' }, { word: 'national identity' }, { word: 'filial piety' },
                { word: 'creativity' }, { word: 'co-operation' }, { word: 'critical thinking' }
            ]
        }
    };
</script>
<script>
    let selectedGrade = '';
    let selectedMode = '';
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let earnedCoins = 0;

    function spawnRewardBurst() {
        const icons = ['🪙', '⭐', '✨', '🌟', '🪙', '⭐'];
        const numParticles = 24;
        const rect = document.getElementById('user-input').getBoundingClientRect();
        const startX = rect.left + rect.width / 2;
        const startY = rect.top + rect.height / 2;

        for (let i = 0; i < numParticles; i++) {
            const el = document.createElement('div');
            el.className = 'reward-particle';
            el.textContent = icons[Math.floor(Math.random() * icons.length)];
            el.style.fontSize = (Math.random() * 16 + 22) + 'px';
            el.style.left = startX + 'px';
            el.style.top = startY + 'px';

            const angle = (Math.PI * 2 * i) / numParticles + (Math.random() - 0.5) * 0.5;
            const distance = Math.random() * 140 + 80;
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance - 40;
            const rot = (Math.random() * 360 - 180) + 'deg';

            el.style.setProperty('--tx', `${tx}px`);
            el.style.setProperty('--ty', `${ty}px`);
            el.style.setProperty('--rot', rot);

            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1200);
        }

        earnedCoins += 10;
        const coinBox = document.getElementById('coin-box');
        const coinCount = document.getElementById('coin-count');
        coinCount.textContent = earnedCoins;
        coinBox.classList.add('bump');
        setTimeout(() => coinBox.classList.remove('bump'), 250);
    }

    function updateSpeedLabel() {
        const val = parseFloat(document.getElementById('speed-slider').value);
        const label = document.getElementById('speed-label');
        if (val >= 0.9) { label.textContent = '正常'; }
        else if (val >= 0.7) { label.textContent = '適中'; }
        else if (val >= 0.5) { label.textContent = '慢速'; }
        else { label.textContent = '極慢'; }
    }

    function selectGrade(grade) {
        selectedGrade = grade;
        document.querySelectorAll('.btn-grade').forEach(btn => {
            btn.classList.remove('active');
            if(btn.textContent.includes(grade.substring(0,2))) btn.classList.add('active');
        });

        const gradeData = wordDatabase[selectedGrade] || {};
        const modeOptions = document.querySelector('.mode-options');
        modeOptions.innerHTML = ''; 

        let availableModes = [];
        if (gradeData.dictation && gradeData.dictation.length > 0) availableModes.push('dictation');
        if (gradeData.extra_vocab && gradeData.extra_vocab.length > 0) availableModes.push('extra_vocab');
        if (gradeData.sentence && gradeData.sentence.length > 0) availableModes.push('sentence');
        
        const modeArea = document.getElementById('mode-selection-area');
        if (availableModes.length > 0) {
            modeArea.style.display = 'block';
            availableModes.forEach(mode => {
                let btn = document.createElement('button');
                btn.className = 'btn btn-mode';
                btn.dataset.mode = mode;
                btn.onclick = () => selectMode(mode);
                if (mode === 'dictation') btn.innerHTML = '📝 默書';
                if (mode === 'extra_vocab') btn.innerHTML = '🧠 補充';
                if (mode === 'sentence') btn.innerHTML = '✍️ 句子';
                modeOptions.appendChild(btn);
            });
            selectMode(availableModes[0]);
        } else {
            modeArea.style.display = 'none';
            selectedMode = availableModes[0] || '';
        }
        document.getElementById('btn-start').style.display = 'block';
    }

    function selectMode(mode) {
        selectedMode = mode;
        document.querySelectorAll('.btn-mode').forEach(btn => {
            btn.classList.remove('active');
            if(btn.dataset.mode === mode) {
                btn.classList.add('active');
            }
        });
    }

    function startGame() {
        const pool = wordDatabase[selectedGrade][selectedMode] || [];
        currentQuestions = [...pool].sort(() => 0.5 - Math.random());
        
        if (currentQuestions.length === 0) {
            alert('抱歉，這個模式暫時沒有題目。');
            return;
        }

        currentIndex = 0;
        score = 0;
        earnedCoins = 0;
        document.getElementById('coin-count').textContent = '0';

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        document.getElementById('result-screen').style.display = 'none';

        updateSpeedLabel();
        const phonicsBtn = document.getElementById('btn-phonics-hint');
        const isVocab = selectedMode === 'dictation' || (selectedMode === 'extra_vocab' && currentQuestions[0]?.phonicsArr);
        
        const modeLabels = { dictation: '默書單字', extra_vocab: '補充詞彙', sentence: '句子默寫' };
        document.getElementById('current-mode-label').textContent = modeLabels[selectedMode] || '';
        phonicsBtn.style.display = isVocab ? 'inline-block' : 'none';

        loadQuestion();
    }
    
    function loadQuestion() {
        if (currentIndex >= currentQuestions.length) {
            showResults();
            return;
        }
        const hasPhonics = !!currentQuestions[currentIndex].phonicsArr;

        document.getElementById('feedback-msg').innerHTML = '';
        document.getElementById('user-input').value = '';
        document.getElementById('user-input').focus();
        document.getElementById('btn-phonics-hint').style.display = hasPhonics ? 'inline-block' : 'none';
        
        const progressPercent = (currentIndex / currentQuestions.length) * 100;
        document.getElementById('progress').style.width = progressPercent + '%';
        document.getElementById('current-question').textContent = currentIndex + 1;
        document.getElementById('total-questions').textContent = currentQuestions.length;

        document.getElementById('phonics-display').textContent = hasPhonics ? '❓ 按按鈕獲取拼音提示' : '';
        const currentMeaning = currentQuestions[currentIndex].meaning;
        document.getElementById('meaning-display').textContent = currentMeaning ? `💡 中文意思：${currentMeaning}` : '';
        
        setTimeout(() => playWordSound(), 500); 
    }

    function playWordSound() {
        if (!('speechSynthesis' in window) || !currentQuestions[currentIndex]) {
            if (!('speechSynthesis' in window)) alert('瀏覽器不支援語音功能！');
            return;
        }
        
        window.speechSynthesis.cancel(); 
        const text = currentQuestions[currentIndex].word;
        const currentSpeed = parseFloat(document.getElementById('speed-slider').value);
        const isSentence = selectedMode === 'sentence' || (selectedMode === 'extra_vocab' && text.includes(' '));

        if (isSentence) {
            const words = text.split(' ');
            let delay = 0;
            words.forEach((w) => {
                setTimeout(() => {
                    const wordUtterance = new SpeechSynthesisUtterance(w);
                    wordUtterance.lang = 'en-US';
                    wordUtterance.rate = currentSpeed;
                    window.speechSynthesis.speak(wordUtterance);
                }, delay);
                const dynamicPause = 400 + ((1.0 - currentSpeed) * 800); 
                delay += (w.length * 60) * (1 / currentSpeed) + dynamicPause; 
            });
        } else {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = currentSpeed;
            window.speechSynthesis.speak(utterance);
        }
    }

    function showPhonicsHint() {
        const currentData = currentQuestions[currentIndex];
        if (!currentData || !currentData.phonicsArr) return;

        const hintPlaceholders = currentData.phonicsArr.map(part => {
            if (part === ' ') return ' ';
            return '_'.repeat(part.length);
        }).join(' - ');
        document.getElementById('phonics-display').textContent = `拼音格式：${hintPlaceholders}`;

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            currentData.phonicsArr.forEach((part, index) => {
                setTimeout(() => {
                    const partUtterance = new SpeechSynthesisUtterance(part);
                    partUtterance.lang = 'en-US';
                    partUtterance.rate = 0.5;
                    window.speechSynthesis.speak(partUtterance);
                }, index * 800);
            });
        }
    }

    function checkAnswer() {
        const userInput = document.getElementById('user-input').value.trim();
        if(userInput === '') return;
        
        const correctAnswer = currentQuestions[currentIndex].word.trim();
        const feedback = document.getElementById('feedback-msg');
        
        const cleanStr = (str) => str.toLowerCase().replace(/\s+/g, ' ').replace(/[.,/#!$%^&*;:{}=\-_`~()?']/g,"").trim();
        const cleanUser = cleanStr(userInput);
        const cleanCorrect = cleanStr(correctAnswer);

        if (cleanUser === cleanCorrect) {
            if (userInput !== correctAnswer) {
                feedback.innerHTML = `🎉 答對了！但要注意大小寫或標點符號喔！<br><span style="color:#7F8C8D; font-size:0.95rem;">標準答案：<b>${correctAnswer}</b></span>`;
            } else {
                feedback.textContent = '🎉 完美正確！太棒了！';
            }
            feedback.className = 'feedback correct';
            score += (100 / currentQuestions.length);
            playFeedbackSound(true);
            spawnRewardBurst();
        } else {
            feedback.innerHTML = `❌ 答錯囉！正確答案是：<br><span style="font-size:1.15rem; color:var(--wrong-color);"><b>${correctAnswer}</b></span>`;
            feedback.className = 'feedback wrong';
            playFeedbackSound(false);
        }

        document.getElementById('user-input').disabled = true;
        setTimeout(() => {
            document.getElementById('user-input').disabled = false;
            currentIndex++;
            loadQuestion();
        }, 4000); 
    }

    function handleKeyUp(event) {
        if (event.key === 'Enter' && !currentQuestions[currentIndex]?.word.includes(' ')) {
            checkAnswer();
        }
    }

    function playFeedbackSound(isCorrect) {
        if (!window.AudioContext && !window.webkitAudioContext) return;
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (isCorrect) {
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.3);
        } else {
            osc.frequency.setValueAtTime(150, ctx.currentTime);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.4);
        }
    }

    function showResults() {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        const finalScoreRounded = Math.round(score);
        document.getElementById('final-score').textContent = finalScoreRounded;
        document.getElementById('total-earned-coins').textContent = earnedCoins;

        let evalMsg = '';
        if(finalScoreRounded === 100) {
            evalMsg = '🏆 完美的表現！您已經徹底掌握了這次的溫習範圍！';
        } else if(finalScoreRounded >= 80) {
            evalMsg = '🌟 表現非常優異！快去挑戰滿分吧！';
        } else if(finalScoreRounded >= 60) {
            evalMsg = '👍 順利合格！錯的地方可以多聽寫幾遍。';
        } else {
            evalMsg = '💪 不要氣餒！再練習幾次，你的聽力和拼寫會進步神速！';
        }
        document.getElementById('evaluation-msg').textContent = evalMsg;
    }

    function resetGame() {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('setup-screen').style.display = 'block';
        document.querySelectorAll('.btn-grade').forEach(btn => btn.classList.remove('active'));
        document.getElementById('mode-selection-area').style.display = 'none';
        document.getElementById('btn-start').style.display = 'none';
    }
</script>
